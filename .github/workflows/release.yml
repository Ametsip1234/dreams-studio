name: Publicar descarga del juego
on:
  push:
    paths: ['release/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unir las partes del zip
        run: cat release/Liminal8.zip.part* > Liminal8.zip && ls -l Liminal8.zip && unzip -tq Liminal8.zip
      - name: Crear la versión con el juego
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0 --yes --cleanup-tag || true
          gh release create v1.0 Liminal8.zip --title "Liminal 8 v1.0" --notes "Descarga Liminal 8 para Windows. Descomprime el zip y abre Liminal 8.exe. Para jugar online necesitas Steam abierto."
